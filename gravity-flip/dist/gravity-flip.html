<style>
/* GRAVITY FLIP — 霓虹赛博外壳样式
   构建脚本 build.mjs 把本文件内容包进一个 style 元素，用于替换 index.html 里的样式占位符注释。
   零外部请求：无字体文件、无图片、无外部样式导入语句。 */

*, *::before, *::after { box-sizing: border-box; }

:root {
  --bg: #05070f;
  --fg: #e8eefc;
  --cyan: #22d3ee;
  --magenta: #f472b6;
  --yellow: #fde047;
}

html { height: 100%; -webkit-text-size-adjust: 100%; }

body {
  height:100dvh; margin:0; overflow:hidden; background:#05070f; color:#e8eefc;
  font-family: system-ui,'Segoe UI',sans-serif; display:flex; flex-direction:column;
}

body {
  background-image:
    radial-gradient(120% 90% at 50% -10%, rgba(34,211,238,.10), transparent 60%),
    radial-gradient(90% 80% at 110% 110%, rgba(244,114,182,.09), transparent 60%),
    radial-gradient(70% 60% at -10% 110%, rgba(253,224,71,.05), transparent 60%);
  background-repeat: no-repeat;
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
}

/* 老浏览器没有 dvh 单位时的兜底，避免出现滚动条 */
@supports not (height: 100dvh) {
  body { height: 100vh; }
}

/* ---------- 顶部 HUD（44–56px） ---------- */
#hud {
  flex: 0 0 auto;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 14px;
  overflow: hidden;
  font-size: 13px;
  letter-spacing: .02em;
  border-bottom: 1px solid rgba(34,211,238,.22);
  background: linear-gradient(180deg, rgba(34,211,238,.07), rgba(5,7,15,0));
  box-shadow: 0 1px 0 rgba(244,114,182,.12), 0 10px 26px -18px rgba(34,211,238,.75);
}

.hud-item { flex: 0 0 auto; display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.hud-label { color: #8fa3c8; font-size: 11px; letter-spacing: .14em; }
#hud b { font-weight: 700; font-variant-numeric: tabular-nums; }

#level { color: var(--cyan);    text-shadow: 0 0 10px rgba(34,211,238,.65); }
#time  { color: var(--yellow);  text-shadow: 0 0 10px rgba(253,224,71,.50); }
#flips { color: var(--magenta); text-shadow: 0 0 10px rgba(244,114,182,.60); }
#stars { color: var(--yellow);  text-shadow: 0 0 10px rgba(253,224,71,.55); }

#hint {
  flex: 1 1 auto;
  min-width: 0;
  margin: 0 0 0 auto;
  color: #7d8dab;
  font-size: 12px;
  text-align: right;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- 舞台 ---------- */
#wrap {
  flex: 1;
  min-height: 0;
  position: relative;
  display: grid;
  place-items: center;
  padding: 8px;
}

#game {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  aspect-ratio: 16 / 9;
  display: block;
  background: #080b16;
  border: 1px solid rgba(34,211,238,.45);
  border-radius: 14px;
  box-shadow:
    0 0 0 1px rgba(34,211,238,.18),
    0 0 22px rgba(34,211,238,.30),
    0 0 64px rgba(244,114,182,.18),
    inset 0 0 40px rgba(34,211,238,.06);
  touch-action: none;
}

/* ---------- 覆盖层（默认 hidden） ---------- */
#overlay {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: radial-gradient(62% 62% at 50% 45%, rgba(5,7,15,.74), rgba(5,7,15,.93));
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
}

#overlay[hidden] { display: none; }

.overlay-card {
  width: min(92%, 460px);
  max-height: 100%;
  overflow: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 20px 20px 18px;
  text-align: center;
  border: 1px solid rgba(34,211,238,.5);
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(11,16,28,.96), rgba(5,7,15,.97));
  box-shadow: 0 0 30px rgba(34,211,238,.25), 0 0 80px rgba(244,114,182,.16);
}

#overlay-title {

  font-size: 26px;

}

}

#overlay-buttons {

}

#overlay-buttons button {
  flex: 1 1 auto;

/* ---------- 底部触屏控制条（桌面同样显示） ---------- */

}

.ctl[data-action="jump"] {

  border-color: rgba(253,224,71,.5);

}

.ctl[data-action="jump"]:active {
  border-color: rgba(253,224,71,.95);

  box-shadow: 0 0 18px rgba(253,224,71,.8), 0 0 44px rgba(253,224,71,.3);
}

/* flip 是核心机制：视觉最突出 */
.ctl[data-action="flip"] {
  font-size: 19px;
  font-weight: 900;
  color: #0a0512;

  border-radius: 16px;
  background: linear-gradient(145deg, var(--magenta), var(--cyan));
  box-shadow:
    0 0 0 1px rgba(244,114,182,.55),
    0 0 22px rgba(34,211,238,.75),
    0 0 48px rgba(244,114,182,.50);
  animation: flipPulse 1.8s ease-in-out infinite;
}

@keyframes flipPulse {
  0%, 100% {
    box-shadow: 0 0 0 1px rgba(244,114,182,.55), 0 0 18px rgba(34,211,238,.60), 0 0 36px rgba(244,114,182,.35);
  }
  50% {
    box-shadow: 0 0 0 1px rgba(244,114,182,.90), 0 0 30px rgba(34,211,238,.95), 0 0 64px rgba(244,114,182,.70);
  }
}

.ctl[data-action="flip"]:active {
  background: linear-gradient(145deg, #67e8f9, var(--magenta));
  box-shadow: 0 0 34px rgba(34,211,238,.95), 0 0 70px rgba(244,114,182,.8);
  transform: translateY(1px) scale(.98);
}

.ctl:focus-visible,
#overlay-buttons button:focus-visible {
  outline: 2px solid var(--yellow);
  outline-offset: 2px;
}

/* ---------- 小屏 / 矮屏 ---------- */
@media (max-width: 560px) {
  #hud { height: 44px; gap: 10px; padding: 0 10px; }
  #hint { font-size: 11px; letter-spacing: 0; }
  .hud-label { display: none; }
  #pad { height: 76px; gap: 8px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .ctl { font-size: 15px; border-radius: 12px; }
  .ctl[data-action="flip"] { font-size: 17px; }
  #overlay-title { font-size: 22px; }
}

@media (max-height: 560px) {
  #hud { height: 44px; }
  #pad { height: 72px; }
}

@media (prefers-reduced-motion: reduce) {
  .ctl[data-action="flip"] { animation: none; }
  .ctl { transition: none; }
}

</style>

<body>
<header id="hud">
  <div class="hud-item"><span class="hud-label">关卡</span><b id="level">1 / 12</b></div>
  <div class="hud-item"><span class="hud-label">时间</span><b id="time">0.0</b></div>
  <div class="hud-item"><span class="hud-label">翻转</span><b id="flips">0</b></div>
  <div class="hud-item"><span class="hud-label">星星</span><b id="stars">0 / 3</b></div>
  <p id="hint">←/→ 或 A/D 移动 · Space/↑/W 跳 · Z/↓/S 翻转重力 · P 暂停 · R 重开</p>
</header>

<main id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="overlay" hidden>
    <div class="overlay-card">

    </div>

</main>

<nav id="pad" aria-label="触屏操作">
  <button type="button" class="ctl" data-action="left" aria-label="向左移动">◀</button>
  <button type="button" class="ctl" data-action="right" aria-label="向右移动">▶</button>

<script>
/* ===== js/physics.js (window.GF_PHYSICS) ===== */
'use strict';
/* =========================================================================
 * GRAVITY FLIP — 纯确定性物理与关卡仿真
 * 这个文件不接触 DOM，可同时被浏览器（构建脚本会把它内联进页面）和
 * node（require）使用。游戏渲染与关卡验证必须共用这里的同一套规则，
 * 避免「验证器通过但玩不了」。
 * ========================================================================= */

const PHYS = {
  TILE: 40,
  W: 1280,
  H: 720,
  COLS: 32,
  ROWS: 18,

  GRAVITY: 2400,        // px/s^2，沿重力方向
  MOVE_SPEED: 300,      // px/s，恒定，无惯性
  JUMP_V: -720,         // 相对重力方向的初速度
  WALLJUMP_VX: 240,     // 墙跳获得的反向水平速度
  MAX_FALL: 1500,
  PW: 24,               // 玩家 AABB 宽
  PH: 28,               // 玩家 AABB 高
  H_INSET: 2,           // 水平碰撞时上下内缩像素（避免把地板/天花板当成墙）

  DT: 1 / 60,
  EPS: 0.5,             // 落地判定的贴地容差
  HURT_INVULN: 1.1,     // 受伤无敌时间（秒）
  MAX_DEATHS: 3,        // 第 4 次死亡 = 本关失败
  DEATH_PAUSE: 0.45,    // 死亡后短暂冻结，然后回到出生点
  SAW_R: 18
};

const GLYPHS = {
  SPAWN: 'P',
  EXIT: 'E',
  STAR: '*',
  SPIKE_UP: '^', SPIKE_DOWN: 'v', SPIKE_LEFT: '<', SPIKE_RIGHT: '>'
};

const SPIKE_DIRS = {
  '^': { dx: 0, dy: -1 },
  'v': { dx: 0, dy: 1 },
  '<': { dx: 1, dy: 0 },
  '>': { dx: -1, dy: 0 }
};

/** 把 ASCII 地图编译成可碰撞/可渲染的结构。level 对象可重复编译。 */
function compileLevel(level) {
  const map = level.map || [];
  if (map.length !== PHYS.ROWS) throw new Error('关卡 ' + level.id + ' 行数应为 ' + PHYS.ROWS + '，实际 ' + map.length);
  for (let r = 0; r < map.length; r++) {
    if (map[r].length !== PHYS.COLS) {
      throw new Error('关卡 ' + level.id + ' 第 ' + r + ' 行宽度应为 ' + PHYS.COLS + '，实际 ' + map[r].length);
    }
  }

  const solid = new Uint8Array(PHYS.COLS * PHYS.ROWS);
  const spikes = [];
  const stars = [];
  let spawn = null;
  let exit = null;

  for (let r = 0; r < PHYS.ROWS; r++) {
    for (let c = 0; c < PHYS.COLS; c++) {
      const ch = map[r][c];
      const cx = c * PHYS.TILE + PHYS.TILE / 2;
      const cy = r * PHYS.TILE + PHYS.TILE / 2;
      if (ch === '#') {
        solid[r * PHYS.COLS + c] = 1;
      } else if (ch === GLYPHS.SPAWN) {
        spawn = { x: cx, y: cy, col: c, row: r };
      } else if (ch === GLYPHS.EXIT) {
        exit = { x: cx, y: cy, col: c, row: r };
      } else if (ch === GLYPHS.STAR) {
        stars.push({ x: cx, y: cy, col: c, row: r, taken: false });
      } else if (SPIKE_DIRS[ch]) {
        const d = SPIKE_DIRS[ch];
        spikes.push({ x: cx, y: cy, col: c, row: r, g: ch, dx: d.dx, dy: d.dy });
      } else if (ch !== '.') {
        throw new Error('关卡 ' + level.id + ' 未知字符 "' + ch + '" @ (' + c + ',' + r + ')');
      }
    }
  }
  if (!spawn) throw new Error('关卡 ' + level.id + ' 缺少出生点 P');
  if (!exit) throw new Error('关卡 ' + level.id + ' 缺少出口 E');

  // 出生点/出口占用的泳道格必须仍然是实心：它们是「站在地板上的位置」，
  // 不是地板上的洞。关卡编译器会把这类格子列在 solidCells 里。
  for (const cell of (level.solidCells || [])) {
    const c = cell[0], r = cell[1];
    if (c >= 0 && c < PHYS.COLS && r >= 0 && r < PHYS.ROWS) solid[r * PHYS.COLS + c] = 1;
  }

  // 泳道锚点归一化：如果关卡提供了 spawnAnchor/exitAnchor（由关卡编译器算出），
  // 就用它把出生点/出口贴到地板顶面或天花板底面，避免 AABB 一半嵌进实体里。
  if (level.spawnAnchor && typeof level.spawnAnchor.y === 'number') {
    spawn.x = level.spawnAnchor.col * PHYS.TILE + PHYS.TILE / 2;
    spawn.y = level.spawnAnchor.y;
  }
  if (level.exitAnchor && typeof level.exitAnchor.y === 'number') {
    exit.x = level.exitAnchor.col * PHYS.TILE + PHYS.TILE / 2;
    exit.y = level.exitAnchor.y;
  }

  const saws = (level.saws || []).map(function (s, i) {
    return {      i: i, x: s.x, y: s.y, r: s.r || PHYS.SAW_R,
      axis: s.axis === 'y' ? 'y' : 'x',
      a: s.a, b: s.b, speed: s.speed, phase: s.phase || 0
    };
  });

  return {
    id: level.id,
    name: level.name || ('LEVEL ' + level.id),
    hint: level.hint || '',
    par: level.par || { flips: 99, time: 999 },
    map: map.slice(),
    solid: solid, spikes: spikes, saws: saws, stars: stars,
    spawn: spawn, exit: exit
  };
}

function makeSolidLookup(compiled) {
  const s = compiled.solid;
  return function (c, r) {
    if (c < 0 || c >= PHYS.COLS || r < 0 || r >= PHYS.ROWS) return true; // 世界外视为实心
    return s[r * PHYS.COLS + c] === 1;
  };
}

function rectHitsTile(lookup, x, y, w, h) {
  const c0 = Math.floor(x / PHYS.TILE), c1 = Math.floor((x + w - 0.001) / PHYS.TILE);
  const r0 = Math.floor(y / PHYS.TILE), r1 = Math.floor((y + h - 0.001) / PHYS.TILE);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (lookup(c, r)) return true;
  return false;
}

function overlapCircleRect(cx, cy, cr, rx, ry, rw, rh) {
  const nx = Math.max(rx, Math.min(cx, rx + rw));
  const ny = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy <= cr * cr;
}

/* ---------------------------------- 状态 --------------------------------- */

function createSim(compiled) {
  const dyn = {
    id: compiled.id,
    px: compiled.spawn.x, py: compiled.spawn.y,
    vx: 0, vy: 0,
    gravity: 1,          // 1 = 向下, -1 = 向上
    grounded: false,
    onWall: 0,           // -1 左墙, 1 右墙
    flipCount: 0,
    dead: false, deaths: 0,
    won: false, finished: false, failed: false,
    invuln: 0,
    starsTaken: 0
  };
  const stars = compiled.stars.map(function (s) { return { x: s.x, y: s.y, taken: false }; });
  const state = {
    L: compiled,
    dyn: dyn,
    stars: stars,
    time: 0,
    started: false,
    sawT: 0,
    respawnIn: 0,
    prevJump: false,
    prevFlip: false,
    anim: { x: compiled.spawn.x, y: compiled.spawn.y }
  };
  return state;
}

/* ------------------------------- 内部工具 -------------------------------- */

/**
 * 把玩家从实心块里「最小位移」推出来。
 *
 * 为什么必须有这一步：玩家 AABB 是 24x28，而格子是 40px，所以出生点/走廊
 * 边上很容易出现「只嵌进去几像素」的初始状态。没有脱嵌的话，逐轴碰撞解算
 * 会因为「先被垂直复位、再被水平挡回」来回推导，产生一帧内瞬移 40px 的死循环。
 * 这里按最小重叠轴推开，保证每帧开始时玩家都是合法位置。
 */
function depenetrate(state, lookup) {
  const d = state.dyn;
  const w = PHYS.PW, h = PHYS.PH;
  for (let iter = 0; iter < 6; iter++) {
    const c0 = Math.floor((d.px - w / 2) / PHYS.TILE);
    const c1 = Math.floor((d.px + w / 2 - 0.001) / PHYS.TILE);
    const r0 = Math.floor((d.py - h / 2) / PHYS.TILE);
    const r1 = Math.floor((d.py + h / 2 - 0.001) / PHYS.TILE);
    let best = null;
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        if (!lookup(c, r)) continue;
        const left = (c + 1) * PHYS.TILE - (d.px - w / 2);        // 向右推
        const right = (d.px + w / 2) - c * PHYS.TILE;             // 向左推
        const down = (r + 1) * PHYS.TILE - (d.py - h / 2);        // 向下推
        const up = (d.py + h / 2) - r * PHYS.TILE;                // 向上推
        const cands = [
          { axis: 'x', delta: left, dist: left },
          { axis: 'x', delta: -right, dist: right },
          { axis: 'y', delta: down, dist: down },
          { axis: 'y', delta: -up, dist: up }
        ];
        for (const cand of cands) {
          // 只处理「真的重叠」的情况。贴边（重叠 < 0.5px）必须放过，否则
          // 站在地板上会被反复推开，和贴地判定形成拉锯，表现为原地抽搐。
          if (cand.dist <= 0.5) continue;
          if (!best || cand.dist < best.dist) best = cand;
        }
      }
    }
    if (!best) break;
    if (best.axis === 'x') d.px += best.delta + (best.delta > 0 ? 0.01 : -0.01);
    else d.py += best.delta + (best.delta > 0 ? 0.01 : -0.01);
    if (state.trace) console.log('   [depen] ' + best.axis + ' delta=' + best.delta.toFixed(2) + ' -> (' + d.px.toFixed(1) + ',' + d.py.toFixed(1) + ')');
  }
}

function axisMovement(state, axis, delta, lookup) {
  // 逐小步推进；只要这一步会插进实心块，就「撤销这一步并停下」。
  // 早期版本在撤销之后还会用公式重新推算坐标，一旦玩家本来就离格子边界
  // 有偏差（AABB 24x28 放在 40px 格子里很常见），推算就会把人瞬移一整格。
  // 现在只撤销，不再重算，物理行为可预测且不会瞬移。
  //
  // 另外水平碰撞必须把判定盒上下各内缩 2px：玩家高 28px 而地板行高 40px，
  // 站在地板上时脚底会「贴」进地板格一点点，若不内缩，地板本身会被当成
  // 一堵墙，导致角色一迈步就被挡住（无法沿地面行走）。
  const d = state.dyn;
  const w = PHYS.PW, h = PHYS.PH;
  const sign = delta > 0 ? 1 : -1;
  const box = axis === 'x'
    ? { x: d.px - w / 2, y: d.py - h / 2 + PHYS.H_INSET, w: w, h: h - PHYS.H_INSET * 2 }
    : { x: d.px - w / 2, y: d.py - h / 2, w: w, h: h };
  let remain = Math.abs(delta);
  while (remain > 0) {
    const move = Math.min(remain, PHYS.TILE * 0.5);
    remain -= move;
    if (axis === 'x') {
      const old = d.px;
      d.px += sign * move;
      box.x = d.px - w / 2;
      if (rectHitsTile(lookup, box.x, box.y, box.w, box.h)) {
        if (state.trace) console.log('   [x-hit] old=' + old.toFixed(2) + ' -> ' + d.px.toFixed(2) + ' py=' + d.py.toFixed(2) + ' sign=' + sign);
        d.px = old;
        d.vx = 0;
        return true;
      }
    } else {
      const old = d.py;
      d.py += sign * move;
      if (rectHitsTile(lookup, box.x, d.py - h / 2, w, h)) {
        d.py = old;
        d.vy = 0;
        return true;
      }
    }
  }
  return false;
}

function groundCheck(state, lookup) {
  const d = state.dyn;
  const w = PHYS.PW, h = PHYS.PH;
  // 贴地探针：从脚底（贴边，不偏移）向外 8px 的薄片是否碰到实心。
  // 探针必须从 0 偏移开始——如果从「下方 1px」开始，贴边状态下宽度被压到 7px，
  // 就可能探不到地面；而脱嵌逻辑又会认为重叠 0、不再上推，两边就都失效了。
  const probe = 8;
  const top = d.gravity > 0 ? d.py + h / 2 : d.py - h / 2 - probe;
  if (rectHitsTile(lookup, d.px - w / 2 + 2, top, w - 4, probe)) return true;
  return false;
}

function wallCheck(state, lookup) {
  const d = state.dyn;
  const w = PHYS.PW, h = PHYS.PH;
  const r0 = Math.floor((d.py - h / 2 + 3) / PHYS.TILE);
  const r1 = Math.floor((d.py + h / 2 - 3) / PHYS.TILE);
  const lc = Math.floor((d.px - w / 2 - 1) / PHYS.TILE);
  const rc = Math.floor((d.px + w / 2 + 1) / PHYS.TILE);
  let wall = 0;
  for (let r = r0; r <= r1; r++) {
    if (lookup(lc, r)) { wall = -1; break; }
    if (lookup(rc, r)) { wall = 1; break; }
  }
  return wall;
}

function sawPos(saw, t) {
  const span = saw.b - saw.a;
  const period = Math.abs(span) / (saw.speed || 1) * 2;
  const p = period > 0 ? ((t + saw.phase * period) % period) / period : 0;
  const tri = p < 0.5 ? p * 2 : (1 - p) * 2;
  const v = saw.a + span * tri;
  return saw.axis === 'y' ? { x: saw.x, y: v } : { x: v, y: saw.y };
}

function starOverlap(state, s) {
  const d = state.dyn;
  const nx = Math.max(d.px - PHYS.PW / 2, Math.min(s.x, d.px + PHYS.PW / 2));
  const ny = Math.max(d.py - PHYS.PH / 2, Math.min(s.y, d.py + PHYS.PH / 2));
  const dx = s.x - nx, dy = s.y - ny;
  return dx * dx + dy * dy <= 15 * 15;
}

function boxOverlapTileRect(state, tx, ty, tw, th) {
  const d = state.dyn;
  return d.px - PHYS.PW / 2 < tx + tw && d.px + PHYS.PW / 2 > tx &&
         d.py - PHYS.PH / 2 < ty + th && d.py + PHYS.PH / 2 > ty;
}

function kill(state, reason) {
  const d = state.dyn;
  if (d.dead || d.finished || d.won) return;
  d.dead = true;
  d.deaths += 1;
  d.deathReason = reason || 'hit';
  state.respawnIn = PHYS.DEATH_PAUSE;
  if (d.deaths > PHYS.MAX_DEATHS) { d.failed = true; d.finished = true; }
}

function respawn(state) {
  const d = state.dyn;
  d.px = state.L.spawn.x; d.py = state.L.spawn.y;
  d.vx = 0; d.vy = 0;
  d.gravity = 1;
  d.grounded = false;
  d.invuln = PHYS.HURT_INVULN;
  d.dead = false;
  state.anim.x = d.px; state.anim.y = d.py;
}

function finishLevel(state) {
  const d = state.dyn;
  d.won = true;
  d.finished = true;
}

/* --------------------------------- 主步进 -------------------------------- */

/**
 * 推进一步。keys = { left, right, jump, flip }（布尔，flip/jump 为「按下状态」，
 * 内部会做上升沿检测，长按不会连续触发）。
 * dt 固定为 PHYS.DT 时结果完全确定。
 */
function stepSim(state, keys, dt) {
  dt = dt || PHYS.DT;
  const d = state.dyn;
  const L = state.L;
  const lookup = L._lookup || (L._lookup = makeSolidLookup(L));
  const k = keys || {};
  state.sawT += dt;

  if (d.finished) {
    // 结算后仍然让锯子动，便于画面反馈
    return state;
  }

  if (d.dead) {
    state.respawnIn -= dt;
    d.invuln = Math.max(0, d.invuln - dt);
    if (state.respawnIn <= 0 && !d.failed) respawn(state);
    state.prevJump = !!k.jump; state.prevFlip = !!k.flip;
    return state;
  }

  const jumpPressed = !!k.jump && !state.prevJump;
  const flipPressed = !!k.flip && !state.prevFlip;
  state.prevJump = !!k.jump; state.prevFlip = !!k.flip;

  // 第一次「有意图的操作」才开始计时
  if (!state.started && (k.left || k.right || k.jump || k.flip)) state.started = true;
  if (state.started) state.time += dt;

  d.invuln = Math.max(0, d.invuln - dt);
  depenetrate(state, lookup);      // 保证从合法位置开始本帧

  // 1) 重力翻转（瞬切）
  if (flipPressed) {
    d.gravity = -d.gravity;
    d.flipCount++;
    d.grounded = false;
    d.vy = 0;
    if (typeof state.onFlip === 'function') state.onFlip(d);
  }

  // 2) 水平输入
  d.vx = 0;
  if (k.left) d.vx -= PHYS.MOVE_SPEED;
  if (k.right) d.vx += PHYS.MOVE_SPEED;

  // 3) 贴地判定
  const wasGrounded = groundCheck(state, lookup);
  d.grounded = wasGrounded;

  // 4) 跳跃 / 墙跳
  //    用「事实上的贴地」而不是缓存值，这样出生第一帧就按跳也不会被吞掉。
  if (jumpPressed) {
    if (groundCheck(state, lookup)) {
      d.vy = PHYS.JUMP_V * d.gravity;
      d.grounded = true;
    } else {
      const wall = wallCheck(state, lookup);
      if (wall !== 0) {
        d.vy = PHYS.JUMP_V * d.gravity;
        d.vx = wall * PHYS.WALLJUMP_VX;
      }
    }
  }
  d.onWall = wasGrounded ? 0 : wallCheck(state, lookup);

  // 5) 竖直速度
  d.vy += PHYS.GRAVITY * d.gravity * dt;
  if (d.vy > PHYS.MAX_FALL) d.vy = PHYS.MAX_FALL;
  if (d.vy < -PHYS.MAX_FALL) d.vy = -PHYS.MAX_FALL;

  // 6) 移动与碰撞
  if (d.vx !== 0) axisMovement(state, 'x', d.vx * dt, lookup);
  // axisMovement 会把 vy 清零，所以要在调用前先记下「这一帧是不是正朝地面撞」
  const wasMovingIntoGround = d.vy !== 0 && Math.sign(d.vy) === d.gravity;
  const hitV = d.vy !== 0 ? axisMovement(state, 'y', d.vy * dt, lookup) : false;

  // 7) 落地后清竖直速度。贴地判定合并「探针」与「本帧撞地」两路：
  //    只靠探针会因为在格子边界上的舍入而在个别帧抖动，导致贴地标志闪烁。
  if (groundCheck(state, lookup) && (Math.sign(d.vy) === d.gravity || (hitV && wasMovingIntoGround) || d.vy === 0)) {
    d.grounded = true;
    d.vy = 0;
  }

  // 8) 星星
  for (let i = 0; i < state.stars.length; i++) {
    const s = state.stars[i];
    if (!s.taken && starOverlap(state, s)) { s.taken = true; d.starsTaken++; }
  }

  // 9) 尖刺
  for (let i = 0; i < L.spikes.length; i++) {
    const sp = L.spikes[i];
    if (spikeHits(state, sp)) { kill(state, 'spike'); return state; }
  }

  // 10) 锯子
  for (let i = 0; i < L.saws.length; i++) {
    const saw = L.saws[i];
    const p = sawPos(saw, state.sawT);
    if (overlapCircleRect(p.x, p.y, saw.r * 0.9,
        d.px - PHYS.PW / 2, d.py - PHYS.PH / 2, PHYS.PW, PHYS.PH)) {
      kill(state, 'saw'); return state;
    }
  }

  // 11) 出口
  if (d.starsTaken >= state.stars.length) {
    if (boxOverlapTileRect(state, L.exit.x - 18, L.exit.y - 18, 36, 36)) finishLevel(state);
  }

  return state;
}

/** 尖刺按朝向生成一个贴面对齐的判定盒（比视觉略宽容） */
function spikeHits(state, sp) {
  const t = PHYS.TILE;
  const pad = 8;
  let x, y, w, h;
  if (sp.dy === -1) {        // 朝上，装在下方地板
    x = sp.x - t / 2 + 4; y = sp.y + 4; w = t - 8; h = t / 2 + pad;
  } else if (sp.dy === 1) {  // 朝下，装在上方天花板
    x = sp.x - t / 2 + 4; y = sp.y - t / 2 - pad + 8; w = t - 8; h = t / 2 + pad;
  } else if (sp.dx === 1) {  // 朝左，装在右墙
    x = sp.x - t / 2 - pad + 8; y = sp.y - t / 2 + 4; w = t / 2 + pad; h = t - 8;
  } else {                   // 朝右，装在左墙
    x = sp.x + 4; y = sp.y - t / 2 + 4; w = t / 2 + pad; h = t - 8;
  }
  // 判定收紧：把整体向内缩 4px，避免「看着没碰到却死」
  const shrink = 5;
  x += shrink; y += shrink; w -= shrink * 2; h -= shrink * 2;
  return boxOverlapTileRect(state, x, y, w, h);
}

/* ------------------------------ 便捷查询接口 ----------------------------- */

function starsLeft(state) {
  return state.stars.filter(function (s) { return !s.taken; }).length;
}

function isWon(state) { return state.dyn.won === true; }
function isOver(state) { return state.dyn.finished === true; }

/** 3 星判定：时间 <= par.time 且 翻转次数 <= par.flips */
function rateLevel(state) {
  const d = state.dyn;
  if (!d.won) return 0;
  let stars = 1;
  if (state.time <= state.L.par.time) stars++;
  if (d.flipCount <= state.L.par.flips) stars++;
  return stars;
}

/** 把 sim 导出成一个可读取的普通对象（验证器/存档用） */
function snapshot(state) {
  const d = state.dyn;
  return {
    id: d.id, x: d.px, y: d.py, vx: d.vx, vy: d.vy, gravity: d.gravity,
    grounded: d.grounded, flips: d.flipCount, deaths: d.deaths,
    stars: d.starsTaken, time: state.time, won: d.won, failed: d.failed, dead: d.dead
  };
}

const API = {
  PHYS: PHYS, GLYPHS: GLYPHS,
  compileLevel: compileLevel,
  createSim: createSim,
  stepSim: stepSim,
  sawPos: sawPos,
  starsLeft: starsLeft,
  isWon: isWon,
  isOver: isOver,
  rateLevel: rateLevel,
  snapshot: snapshot
};

if (typeof module !== 'undefined' && module.exports) module.exports = API;

/* =========================================================================
 * GRAVITY FLIP — 第 1–6 关（Lead 负责）
 *
 * 设计基线（三件事保证「翻转」是通关必需，而不是可选技巧）：
 *  1) 地面 r16 / 天花板 r4 相距 160px，跳跃只有 108px
 *     —— 从地面登顶必须「跳到最高点再按 Z 翻转」。
 *  2) 天花板被切成 2 段，中间留大缺口：想一路贴天花板平推是不可能的，
 *     必须掉回地面再翻上去。这是第 1 版被搜索器破解后的针对性修复。
 *  3) 场景里放 2 格高的柱子：净高 72px < 108px 跳不上去；柱顶到天花板
 *     只有 2 格，翻转又会撞柱子 —— 只能靠一次精准的翻转时机通过。
 *
 * 坐标约定（已按玩家 AABB 24x28 校验）：
 *   地面泳道：站在实心行 r16(y=660) 上，身体中心在 r16 格心即可
 *   天花板泳道：吊在实心行 r4(y=180) 下，身体中心在 r5 格心 (y=220)
 *   所以「天花板上的星/出口」行号必须是 CEIL+1，「地面上的星」是 GROUND-1。
 *
 * 瓦片：'.' 空  '#' 实心  'P' 出生  'E' 出口  '*' 星
 *       '^' 地面尖刺  'v' 天花板尖刺
 * ========================================================================= */

const COLS = 32, ROWS = 18;
const GROUND = 16, CEIL = 4;

function blankGrid() {
  const g = [];
  for (let r = 0; r < ROWS; r++) g.push(new Array(COLS).fill('.'));
  return g;
}
function fill(g, c0, c1, r0, r1, ch) {
  // 所有矩形必须完整落在世界内：越界一律当成作者写错了，直接报错而不是静默裁掉。
  // 否则 join('') 会让行宽悄悄变短，最终生成一张自相矛盾的地图。
  if (c0 < 0 || c1 > COLS - 1 || r0 < 0 || r1 > ROWS - 1 || c1 < c0 || r1 < r0) {
    throw new Error(`fill 矩形非法: c${c0}..${c1} r${r0}..${r1}`);
  }
  if (ch === undefined || ch === null) ch = '#';   // 结构类矩形省略 ch 时默认实心
  if (String(ch).length !== 1) throw new Error(`fill 字符非法: ${JSON.stringify(ch)}`);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) g[r][c] = ch;
}
function frameAll(g) {
  fill(g, 0, COLS - 1, 0, 2, '#');
  fill(g, 0, COLS - 1, 17, 17, '#');
  fill(g, 0, 0, 0, ROWS - 1, '#');
  fill(g, COLS - 1, COLS - 1, 0, ROWS - 1, '#');
}

/** 编译前先把「对象会不会互相叠」查出来，避免生成一张自相矛盾的地图 */
function build(spec) {
  const g = blankGrid();
  frameAll(g);
  for (const s of (spec.struct || [])) fill(g, s.c0, s.c1, s.r0, s.r1, s.ch || '#');
  for (const s of (spec.spikes || [])) fill(g, s.c0, s.c1, s.r0, s.r1, s.ch);
  for (const p of (spec.stars || [])) {
    const r = p[1], c = p[0];
    if (g[r][c] !== '.') throw new Error(`level ${spec.id}: 星 (${c},${r}) 落在 '${g[r][c]}' 上，必须放在空格`);
    g[r][c] = '*';
  }
  // 出生点/出口允许放在「泳道实体格里」（那正是地板/天花板本体），但必须与星、刺错开
  const at = (p) => g[p[1]][p[0]];
  if (at(spec.spawn) === '*') throw new Error(`level ${spec.id}: 出生点压到星`);
  if (at(spec.exit) === '*') throw new Error(`level ${spec.id}: 出口压到星`);
  if (at(spec.spawn) === '^' || at(spec.spawn) === 'v') throw new Error(`level ${spec.id}: 出生点落在尖刺上`);
  if (at(spec.exit) === '^' || at(spec.exit) === 'v') throw new Error(`level ${spec.id}: 出口落在尖刺上`);
  g[spec.spawn[1]][spec.spawn[0]] = 'P';
  g[spec.exit[1]][spec.exit[0]] = 'E';
  const map = g.map(function (row) { return row.join(''); });
  map.forEach(function (row, i) {
    if (row.length !== COLS) throw new Error('level ' + spec.id + ' row ' + i + ' width ' + row.length);
    if (/undefined|null/.test(row)) throw new Error('level ' + spec.id + ' row ' + i + ' 含 undefined/null 空洞');
  });

  // 泳道锚点归一化 + 支撑断言。
  // 注意：出生点/出口字符本身就是「泳道实体格」，physics 会把这两个格子设为实心
  // （见 solidCells），所以锚点不会被当成地板上的洞。这里只做断言，不改地图字符，
  // 否则 physics 就找不到 P/E 了。
  const bodyH = 28;
  const isSolid = (c, r) => map[r][c] === '#' || map[r][c] === 'P' || map[r][c] === 'E';

  function assertSupport(p, row, anchorName) {
    if (p[1] !== row) return;
    if (!isSolid(p[0], row)) {
      throw new Error(`level ${spec.id}: ${anchorName} (${p[0]},${row}) 所在泳道格不是实体，会直接掉下去`);
    }
  }
  assertSupport(spec.spawn, GROUND, '出生点');
  assertSupport(spec.exit, GROUND, '出口');
  assertSupport(spec.exit, CEIL, '出口');

  const snap = (p, isGround) => {
    const [c, r] = p;
    if (isGround && r === GROUND) {
      return { col: c, row: r, y: GROUND * 40 - bodyH / 2, anchor: 'floor' };
    }
    if (r === CEIL) {
      return { col: c, row: r, y: (CEIL + 1) * 40 + bodyH / 2, anchor: 'ceiling' };
    }
    return { col: c, row: r, y: r * 40 + 20, anchor: 'free' };
  };

  return {
    id: spec.id, name: spec.name, hint: spec.hint, map: map,
    saws: spec.saws || [], par: spec.par || { flips: 99, time: 999 },
    spawnAnchor: snap(spec.spawn, true),
    exitAnchor: snap(spec.exit, false),
    // 这些格子要当成实心（锚点自己所占的泳道格）
    solidCells: [
      [spec.spawn[0], spec.spawn[1]],
      [spec.exit[0], spec.exit[1]]
    ]
  };
}

  const SAVE_KEY = 'gravity-flip-save-v2';
  const W = PHYS.W, H = PHYS.H, T = PHYS.TILE;

  const C = {
    bg: '#05070f', grid: 'rgba(34,211,238,0.045)', tile: '#0b1424',
    tileEdge: '#22d3ee', tileEdgeDim: 'rgba(34,211,238,0.22)',
    spike: '#f472b6', spikeGlow: 'rgba(244,114,182,0.55)',
    star: '#fde047', starGlow: 'rgba(253,224,71,0.5)',
    player: '#67e8f9', playerEdge: '#22d3ee',
    exit: '#4ade80', exitLocked: '#64748b',
    saw: '#fb7185', text: '#e8eefc', dim: 'rgba(232,238,252,0.55)'
  };

  /* ------------------------------ 工具 ------------------------------ */
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;

    hint: $('hint'), overlay: $('overlay'), overlayTitle: $('overlay-title'),
    overlayBody: $('overlay-body'), overlayButtons: $('overlay-buttons'),

  };
  const ctx = el.canvas ? el.canvas.getContext('2d') : null;

  /* ------------------------------ 存档 ------------------------------ */
  const defaultSave = () => ({ v: 2, unlocked: 1, muted: false, best: {} });
  let save = defaultSave();
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') save = Object.assign(defaultSave(), parsed);
    }
  } catch (e) { /* 隐私模式等：静默降级为内存存档 */ }
  function persist() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* 忽略 */ }

  const Sound = (function () {

    }
    function tone(freq, dur, type, gain, slideTo) {
      if (save.muted) return;
      const a = ensure();
      if (!a) return;
      const t0 = a.currentTime;
      const osc = a.createOscillator();
      const g = a.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain || 0.06, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(a.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    }

      unlock: ensure,
      jump() { tone(420, 0.1, 'square', 0.05, 720); },
      flip() { tone(300, 0.16, 'sawtooth', 0.058, 900); },
      land() { tone(180, 0.07, 'triangle', 0.035, 120); },
      star() { tone(880, 0.1, 'sine', 0.07, 1320); },

    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
    // 网格
    g.strokeStyle = C.grid; g.lineWidth = 1;
    for (let x = 0; x <= W; x += T) { g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, H); g.stroke(); }
    for (let y = 0; y <= H; y += T) { g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(W, y + 0.5); g.stroke(); }
    // 实心块

  }

  function pauseGame() {
    if (Game.mode !== 'play') return;
    Game.mode = 'pause';
    showOverlay('已暂停', '<div class="ov-tip">按 P 继续 · R 重开本关</div>', [
      { label: '继续', primary: true, onClick: () => resumeGame() },
      { label: '重开本关', onClick: () => startLevel(Game.index) },
      { label: '回到第 1 关', onClick: () => startLevel(0) }
    ]);
  }
  function resumeGame() { if (Game.mode === 'pause') { Game.mode = 'play'; hideOverlay(); } }

  function showMenu() {
    Game.mode = 'menu';
    const unlocked = clamp(save.unlocked || 1, 1, LEVELS.length);
    const totalStars = Object.keys(save.best).reduce((a, k) => a + ((save.best[k] && save.best[k].stars) || 0), 0);
    const body =
      `<div class="ov-tip">按 <b>Z</b>（或 ↓ / S）翻转重力：踩在地面时你会飞向天花板，再按一次飞回地面。</div>` +
      `<div class="ov-tip">集齐 <b>3 颗星</b>后进入出口门。三星 = 时间 ≤ par 且 翻转 ≤ par。</div>` +
      `<div class="ov-row"><span>已解锁</span><b>${unlocked} / ${LEVELS.length}</b></div>` +
      `<div class="ov-row"><span>累计星星</span><b>${totalStars} / ${LEVELS.length * 3}</b></div>`;
    showOverlay('重力反转 GRAVITY FLIP', body, [
      { label: '开始游戏', primary: true, onClick: () => startLevel(Math.min(unlocked - 1, LEVELS.length - 1)) },
      { label: '从头开始', onClick: () => startLevel(0) }
    ]);
  }

  /* ----------------------------- 特效 ----------------------------- */
  function burst(x, y, color, n, power) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = (0.4 + Math.random()) * (power || 260);
      Game.particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.35 + Math.random() * 0.45, max: 0.8, color: color, r: 1.5 + Math.random() * 2.6
      });
    }
  }

  /* ----------------------------- 更新 ----------------------------- */
  function update(dt) {
    const s = Game.sim;
    if (!s) return;

    if (Game.mode === 'play') {
      const wasDead = s.dyn.dead, wasWon = s.dyn.won;
      const wasGrounded = s.dyn.grounded;
      const starsBefore = s.dyn.starsTaken;
      stepSim(s, keys, dt);

      if (s.dyn.dead && !wasDead) {
        Game.shake = 12; Game.flash = 0.35;
        Sound.die();
        burst(s.dyn.px, s.dyn.py, C.spike, 26, 300);
      }
      if (!s.dyn.dead && wasDead && s.dyn.invuln > PHYS.HURT_INVULN - 0.05) {
        burst(s.dyn.px, s.dyn.py, C.player, 14, 180);
      }
      if (s.dyn.starsTaken > starsBefore) {
        Sound.star();
        burst(s.dyn.px, s.dyn.py - 12, C.star, 16, 200);
      }
      if (s.dyn.grounded && !wasGrounded && !s.dyn.dead) { Sound.land(); }
      if (s.dyn.won && !wasWon) { clearLevel(); return; }
      if (s.dyn.failed) { failLevel(); return; }

      // 拖尾
      Game.trail.push({ x: s.dyn.px, y: s.dyn.py, life: 0.28 });
      if (Game.trail.length > 40) Game.trail.shift();
    }

    for (let i = Game.trail.length - 1; i >= 0; i--) {
      Game.trail[i].life -= dt;
      if (Game.trail[i].life <= 0) Game.trail.splice(i, 1);
    }
    for (let i = Game.particles.length - 1; i >= 0; i--) {
      const p = Game.particles[i];
      p.life -= dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 900 * dt; p.vx *= 0.985;
      if (p.life <= 0) Game.particles.splice(i, 1);
    }
    Game.shake = Math.max(0, Game.shake - dt * 34);
    Game.flash = Math.max(0, Game.flash - dt * 1.8);
    syncHud();
  }

  /* ----------------------------- 渲染 ----------------------------- */
  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function drawSpike(g, sp) {
    const x = sp.x, y = sp.y, h = T / 2;
    g.save();
    g.shadowColor = C.spikeGlow; g.shadowBlur = 12;
    g.fillStyle = C.spike;
    g.beginPath();
    if (sp.dy === -1) {          // 朝上
      g.moveTo(x - T / 2 + 4, y + T / 2 - 2);
      g.lineTo(x, y + T / 2 - 2 - h - 4);
      g.lineTo(x + T / 2 - 4, y + T / 2 - 2);
    } else if (sp.dy === 1) {    // 朝下
      g.moveTo(x - T / 2 + 4, y - T / 2 + 2);
      g.lineTo(x, y - T / 2 + 2 + h + 4);
      g.lineTo(x + T / 2 - 4, y - T / 2 + 2);
    } else if (sp.dx === 1) {    // 朝左
      g.moveTo(x + T / 2 - 2, y - T / 2 + 4);
      g.lineTo(x + T / 2 - 2 - h - 4, y);
      g.lineTo(x + T / 2 - 2, y + T / 2 - 4);
    } else {                     // 朝右
      g.moveTo(x - T / 2 + 2, y - T / 2 + 4);
      g.lineTo(x - T / 2 + 2 + h + 4, y);
      g.lineTo(x - T / 2 + 2, y + T / 2 - 4);
    }
    g.closePath(); g.fill();
    g.restore();
  }

  function drawStar(g, st, t, taken) {
    if (taken) return;
    const pulse = 1 + Math.sin(t * 4 + st.x * 0.01) * 0.08;
    const r = 15 * pulse;
    g.save();
    g.translate(st.x, st.y);
    g.rotate(t * 0.9);
    g.shadowColor = C.starGlow; g.shadowBlur = 18;
    g.fillStyle = C.star;
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 === 0 ? r : r * 0.45;
      const a = (Math.PI / 5) * i - Math.PI / 2;
      g[i === 0 ? 'moveTo' : 'lineTo'](Math.cos(a) * rr, Math.sin(a) * rr);
    }
    g.closePath(); g.fill();
    g.restore();
  }

  function drawExit(g, ex, open, t) {
    const size = 38;
    g.save();
    g.translate(ex.x, ex.y);
    g.shadowColor = open ? 'rgba(74,222,128,0.7)' : 'rgba(100,116,139,0.35)';
    g.shadowBlur = open ? 22 : 8;
    g.strokeStyle = open ? C.exit : C.exitLocked;
    g.lineWidth = 3;
    const pulse = open ? 1 + Math.sin(t * 3) * 0.05 : 1;
    g.scale(pulse, pulse);
    roundRect(g, -size / 2, -size / 2, size, size, 8);
    g.stroke();
    g.globalAlpha = 0.25;
    g.fillStyle = open ? C.exit : C.exitLocked;
    g.fill();
    g.globalAlpha = 1;
    // 内部箭头
    g.beginPath();
    g.moveTo(-7, 0); g.lineTo(7, 0); g.moveTo(3, -5); g.lineTo(8, 0); g.lineTo(3, 5);
    g.stroke();
    g.restore();
  }

  function drawSaw(g, saw, t) {
    const p = sawPos(saw, t);
    g.save();
    g.translate(p.x, p.y);
    g.rotate(t * 6);
    g.shadowColor = 'rgba(251,113,133,0.6)'; g.shadowBlur = 16;
    g.fillStyle = C.saw;
    const teeth = 10, r = saw.r;
    g.beginPath();
    for (let i = 0; i < teeth * 2; i++) {
      const rr = i % 2 === 0 ? r : r * 0.68;
      const a = (Math.PI / teeth) * i;
      g[i === 0 ? 'moveTo' : 'lineTo'](Math.cos(a) * rr, Math.sin(a) * rr);
    }
    g.closePath(); g.fill();
    g.fillStyle = C.bg;
    g.beginPath(); g.arc(0, 0, r * 0.32, 0, Math.PI * 2); g.fill();
    g.restore();
  }

  function drawPlayer(g, s, t) {
    const d = s.dyn;
    if (d.dead) return;
    const w = PHYS.PW, h = PHYS.PH;
    const blink = d.invuln > 0 && Math.floor(t * 18) % 2 === 0;
    g.save();
    g.translate(d.px, d.py);
    // 重力方向指示：面朝被吸引的那一侧
    g.rotate(d.gravity > 0 ? 0 : Math.PI);
    if (blink) g.globalAlpha = 0.45;
    g.shadowColor = 'rgba(103,232,249,0.75)'; g.shadowBlur = 20;
    g.fillStyle = C.player;
    roundRect(g, -w / 2, -h / 2, w, h, 6);
    g.fill();
    g.strokeStyle = C.playerEdge; g.lineWidth = 2; g.stroke();
    // 面罩
    g.shadowBlur = 0;
    g.fillStyle = 'rgba(5,7,15,0.8)';
    roundRect(g, -w / 2 + 4, -h / 2 + 5, w - 8, 8, 3);
    g.fill();
    // 脚
    g.fillStyle = C.playerEdge;
    g.fillRect(-w / 2 + 3, h / 2 - 3, 6, 4);
    g.fillRect(w / 2 - 9, h / 2 - 3, 6, 4);
    g.restore();
  }

  function render(t) {
    if (!ctx) return;
    const s = Game.sim;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // 屏幕抖动
    let sx = 0, sy = 0;
    if (Game.shake > 0) {
      sx = (Math.random() - 0.5) * Game.shake;
      sy = (Math.random() - 0.5) * Game.shake;
    }
    ctx.save();
    ctx.translate(sx, sy);

    if (s) {
      if (bgCacheId !== s.L.id || !bgCache) { bgCache = buildBg(s.L); bgCacheId = s.L.id; }
      ctx.drawImage(bgCache, 0, 0);

      // 拖尾
      for (const tr of Game.trail) {
        const a = clamp(tr.life / 0.28, 0, 1) * 0.22;
        ctx.globalAlpha = a;
        ctx.fillStyle = C.player;
        roundRect(ctx, tr.x - PHYS.PW / 2, tr.y - PHYS.PH / 2, PHYS.PW, PHYS.PH, 6);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      for (const sp of s.L.spikes) drawSpike(ctx, sp);
      for (const st of s.stars) drawStar(ctx, st, t, st.taken);
      drawExit(ctx, s.L.exit, s.dyn.starsTaken >= s.stars.length, t);
      for (const saw of s.L.saws) drawSaw(ctx, saw, s.sawT);
      drawPlayer(ctx, s, t);

      // 粒子
      for (const p of Game.particles) {
        ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // 死亡闪白
    if (Game.flash > 0) {
      ctx.fillStyle = 'rgba(244,114,182,' + (Game.flash * 0.35) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    // 暗角
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.85);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    ctx.restore();
  }

  /* ----------------------------- 主循环 ----------------------------- */
  function frame(ts) {
    if (!Game.lastTs) Game.lastTs = ts;
    let dt = (ts - Game.lastTs) / 1000;
    Game.lastTs = ts;
    // 防抖：时间戳倒退（页面切回前台/异常时钟）时 dt 可能为负或极大，
    // 直接夹到 [0, 0.1]，避免物理因为负步长反向推进。
    if (!(dt > 0)) dt = 0;
    if (dt > 0.1) dt = 0.1;
    const t = ts / 1000;

    if (Game.mode === 'play') {
      Game.accum += dt;
      let steps = 0;
      while (Game.accum >= PHYS.DT && steps < 8) { update(PHYS.DT); Game.accum -= PHYS.DT; steps++; }
      if (steps === 0) { /* 等下一帧 */ }
    } else {
      for (const p of Game.particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; }
      for (let i = Game.particles.length - 1; i >= 0; i--) if (Game.particles[i].life <= 0) Game.particles.splice(i, 1);
      Game.shake = Math.max(0, Game.shake - dt * 34);
      Game.flash = Math.max(0, Game.flash - dt * 1.8);
    }
    render(t);
    requestAnimationFrame(frame);
  }

  /* ------------------------------ 输入 ------------------------------ */
  function setKey(name, down) {
    if (keys[name] === down) return;
    keys[name] = down;
    if (down) Sound.unlock();
  }

  window.addEventListener('keydown', (e) => {
    if (e.repeat) {
      if (keyMap[e.code]) e.preventDefault();
      return;
    }
    const act = keyMap[e.code];
    if (act) { e.preventDefault(); setKey(act, true); return; }
    if (e.code === 'KeyP' || e.code === 'Escape') {
      e.preventDefault();
      if (Game.mode === 'play') pauseGame(); else if (Game.mode === 'pause') resumeGame();
    } else if (e.code === 'KeyR') {
      e.preventDefault();
      if (Game.mode === 'play' || Game.mode === 'pause' || Game.mode === 'fail') startLevel(Game.index);
    } else if (e.code === 'KeyM') {
      save.muted = !save.muted; persist();
    } else if (e.code === 'Enter') {
      if (Game.mode === 'clear') {
        if (Game.index < LEVELS.length - 1) startLevel(Game.index + 1); else startLevel(Game.index);
      } else if (Game.mode === 'fail') {
        startLevel(Game.index);
      } else if (Game.mode === 'menu') {
        startLevel(Math.min((save.unlocked || 1) - 1, LEVELS.length - 1));
      }
    }
  }, { passive: false });

  window.addEventListener('keyup', (e) => {
    const act = keyMap[e.code];
    if (act) { e.preventDefault(); setKey(act, false); }
  }, { passive: false });

  window.addEventListener('blur', () => {
    keys.left = keys.right = keys.jump = keys.flip = false;
    if (Game.mode === 'play') pauseGame();
  });

  // 触屏/鼠标按钮
  if (el.pad) {
    const bind = (btn) => {
      const act = btn.getAttribute('data-action');
      if (!act) return;
      const down = (e) => { e.preventDefault(); Sound.unlock(); setKey(act, true); btn.classList.add('active'); };
      const up = (e) => { if (e) e.preventDefault(); setKey(act, false); btn.classList.remove('active'); };
      btn.addEventListener('pointerdown', down);
      btn.addEventListener('pointerup', up);
      btn.addEventListener('pointercancel', up);
      btn.addEventListener('pointerleave', up);
      btn.addEventListener('contextmenu', (e) => e.preventDefault());
    };
    Array.prototype.forEach.call(el.pad.querySelectorAll('button'), bind);
  }

  // 画布点击 = 翻转（移动端便捷操作）
  if (el.canvas) {
    el.canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      Sound.unlock();
      if (Game.mode === 'play') { setKey('flip', true); setTimeout(() => setKey('flip', false), 90); }
    });
    el.canvas.addEventListener('pointerup', () => setKey('flip', false));
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && Game.mode === 'play') pauseGame();
  });

  /* --------------------------- 画布缩放 --------------------------- */
  function fitCanvas() {
    if (!el.canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    el.canvas.width = W * dpr;
    el.canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
  }
  window.addEventListener('resize', () => { fitCanvas(); });

  /* ------------------------------ 启动 ------------------------------ */
  function boot() {
    if (!LEVELS.length) {
      if (el.overlayBody) el.overlayBody.textContent = '关卡数据未加载';
      return;
    }
    fitCanvas();
    // 起始背景
    const L0 = compileLevel(LEVELS[0]);
    Game.sim = createSim(L0);
    bgCache = buildBg(L0); bgCacheId = L0.id;
    showMenu();
    requestAnimationFrame(frame);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  // 暴露给调试/验证使用
  window.GF_GAME = { Game, LEVELS, startLevel, keys, save, bestOf, PHYS };
})();

</script>
</body>
</html>
